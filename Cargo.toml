[package]
name = "c3rs"
version = "0.4.0"
edition = "2021"
description = "Runtime + éditeur natif Rust pour jeux Construct 3 (.c3p) - import universel, 100% natif GPU"
license = "MIT"
repository = "https://github.com/Ahom165/construct3-rust"
readme = "README.md"
keywords = ["gamedev", "construct3", "engine", "runtime", "editor"]
categories = ["game-engines"]

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
png = "0.17"
minifb = "0.27"
font8x8 = "0.3"
base64 = "0.22"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
