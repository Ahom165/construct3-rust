name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            bin: c3-editor
            ext: ""
          - os: windows-latest
            name: windows-x64
            bin: c3-editor
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            bin: c3-editor
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: bash
        run: |
          DIR="construct3-rust-${{ matrix.name }}"
          EXT="${{ matrix.ext }}"
          mkdir -p "dist/$DIR"
          cp "target/release/${{ matrix.bin }}$EXT" "dist/$DIR/"
          cp "target/release/c3rs$EXT" "dist/$DIR/" 2>/dev/null || true
          cp README.md LICENSE "dist/$DIR/" 2>/dev/null || true
          mkdir -p "dist/$DIR/ui-reference"
          cp docs/ui-reference/* "dist/$DIR/ui-reference/" 2>/dev/null || true
          cp demo/demo-platformer.c3p "dist/$DIR/example.c3p" 2>/dev/null || true
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Compress-Archive -Path '$DIR' -DestinationPath '$DIR.zip' -Force"
          else
            zip -r "$DIR.zip" "$DIR"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: construct3-rust-${{ matrix.name }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Collect extras
        run: |
          zip -r dist/ui-reference-pack.zip docs/ui-reference
          cp demo/demo-platformer.c3p dist/ 2>/dev/null || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
