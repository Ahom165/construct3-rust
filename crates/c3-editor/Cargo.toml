[package]
name = "c3-editor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Web editor + runtime server (serves UI, imports anything, exports HTML5)"

[[bin]]
name = "c3-editor"
path = "src/main.rs"

[dependencies]
c3-core = { path = "../c3-core" }
serde_json = "1"
tiny_http = "0.12"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
