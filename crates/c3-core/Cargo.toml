[package]
name = "c3-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core: .c3p parsing, universal file import, HTML5 export"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
